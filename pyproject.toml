[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "owce"
version = "0.1.0"
description = "Online Weakness-Conditioned Evaluation"
readme = "README.md"
requires-python = ">=3.11"

# Pinned: inspect-evals fixes the benchmark loaders and corpora, and with
# them the seed items.
dependencies = [
  "inspect-ai==0.3.174",
  "inspect-evals[math]==0.3.106",
  "openai>=2,<3",
  "anthropic>=0.62,<1",
  "google-genai>=1,<2",
  "numpy>=2,<3",
  "python-dotenv>=1,<2",
]

[tool.setuptools]
packages = ["owce"]
